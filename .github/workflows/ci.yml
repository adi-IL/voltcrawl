name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, Test & Build (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun test

      - name: Run Bun Stdio Integration Test
        run: bun run tests/stdio-test.ts

      - name: Build Production Node Bundle
        run: bun run build

      - name: Verify Build Artifact
        run: |
          if [ ! -s dist/index.js ]; then
            echo "Error: dist/index.js is missing or empty"
            exit 1
          fi

      - name: Package Tarball Verification (Dry Run)
        run: npm pack --dry-run

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voltcrawl-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test-node-matrix:
    name: Node Compatibility (${{ matrix.node-version }})
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun for dependencies
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: voltcrawl-dist
          path: dist/

      - name: Verify CLI Stdio Handshake with Node.js
        run: node bin/cli.js --help && node bin/cli.js --version

      - name: Test Package Tarball Installation & Binary Execution
        run: |
          TARBALL=$(npm pack | tail -n 1)
          npx --yes "./$TARBALL" --help
          npx --yes "./$TARBALL" --version
          rm "$TARBALL"

  ci-success:
    name: All Checks Passed
    needs: [validate-and-build, test-node-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.validate-and-build.result }}" != "success" ] || [ "${{ needs.test-node-matrix.result }}" != "success" ]; then
            echo "Pipeline failed: validate-and-build=${{ needs.validate-and-build.result }}, test-node-matrix=${{ needs.test-node-matrix.result }}"
            exit 1
          fi
          echo "All CI validations passed successfully."
